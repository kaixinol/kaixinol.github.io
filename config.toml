# serene v5.5.0
#
# - docs: https://github.com/isunjn/serene/blob/latest/USAGE.md
# - check for updates: https://github.com/isunjn/serene/releases
#

base_url = "https://kaixinol.github.io"
title = "Kaesinol's Blog"
description = "A blog about programming, technology, and more."
default_language = "zh-CN"
theme = "serene"
output_dir = "public"
compile_sass = true
minify_html = false # Keep this false, as it may cause issues with some styles
build_search_index = false # Keep this false, search is temporarily unsupported
generate_feeds = false # Whether to generate a feed file in root, read docs for more info about rss feed
feed_filenames = ["feed.xml"] # "feed.xml" | "atom.xml" | "rss.xml", read docs for more info
taxonomies = [{ name = "tags" }, { name = "categories" }]
[markdown]
lazy_async_image = false # UPSTREAM: do not enable it, see getzola/zola#2679 (fixed in zola 0.23 (not released))
render_emoji = true
external_links_target_blank = true
external_links_no_follow = true
external_links_no_referrer = true
smart_punctuation = true
github_alerts = true  # optional, enables GitHub-style callout syntax
[markdown.highlighting]
style = "class"
light_theme = "github-light"  # or any zola built-in theme
dark_theme = "github-dark"    # or any zola built-in theme
[slugify]
paths = "on"
taxonomies = "on"
anchors = "safe"
math = true
mermaid = true
featured = true

[extra]

sections = [
  { name = "posts", path = "/posts", is_external = false },
  { name = "tags", path = "/tags", is_external = false },
{ name = "tools", path = "/tools", is_external = false },
  { name = "about", path = "/about", is_external = false },
]
blog_section_path = "/posts"

back_link_text = "Back" # Text of the back button
force_theme = false # false | "light" | "dark"

footer_copyright = """Content licensed under <a href=\"https://creativecommons.org/licenses/by-sa/4.0/\">CC BY-SA 4.0</a>.
    Code licensed under <a href=\"https://opensource.org/licenses/MIT\">MIT</a>."""
footer_credits = true # Whether to show "Built with zola and serene" in footer
not_found_error_text = "404 Not Found"
not_found_recover_text = "« back to home »"

reaction = false # Whether to enable anonymous emoji reactions (Note: You need to set up a working api endpoint to enable this feature)
reaction_align = "right" # "left" | "center" | "right"
reaction_endpoint = "https://example.com/api/reaction"
taxonomies = [
    { name = "tags", feed = true },
    { name = "categories", feed = true },
]

# Map English taxonomy term names to Chinese display labels (URLs stay English)
tag_display = { userscript = "油猴" }
category_display = { tech = "技术", thinking = "思考" }
